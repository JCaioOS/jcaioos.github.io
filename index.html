<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em Construção</title>
    <style>
        /* Isso é o CSS: define a aparência da página */
        body {
            background-color: #1a1a1a; /* Fundo escuro, estilo terminal/gamer */
            color: #00ff41; /* Verde "Matrix" para o texto */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>> Página em Construção <span class="blink">_</span></h1>
        <p>Olá! Este é o meu espaço na web.</p>
        <p>Atualmente cursando Ciência da Computação no IME-USP.</p>
        <hr style="border-color: #00ff41;">
        <p>Projetos e portfólio em breve.</p>
    </div>

</body>
</html>
